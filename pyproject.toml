[project]
name = "sweetspot"
version = "0.2.0"
description = "Seat listening lab: loudspeaker rendering in cinemas and cars, heard binaurally, with plug-in algorithms and evals"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "streamlit>=1.46", "plotly>=5.18", "soundfile>=0.12"]

[project.optional-dependencies]
sofa = ["sofar>=1.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sweetspot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
